<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sales Report</title>

    <link rel="stylesheet" href="https://cdn.boldreports.com/14.1.12/content/v2.0/tailwind-light/bold.report-viewer.min.css">

    <style>
        html,
        body,
        #viewer {
            width: 100%;
            height: 100%;
            min-height: 400px;
            margin: 0;
        }

        body {
            overflow: hidden;
            background: #ff8502;
            color: #172033;
            font-family: Arial, sans-serif;
        }

        #status {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f8fafc;
            text-align: center;
        }

        #status[hidden] {
            display: none;
        }

        #status.error {
            color: #991b1b;
        }

        #status-message {
            max-width: 680px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    
    <div id="status" role="status" aria-live="polite">
        <div id="status-message">Loading sales report...</div>
    </div>
    <div id="viewer" aria-label="Sales report viewer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.boldreports.com/14.1.12/scripts/v2.0/common/bold.reports.common.min.js"></script>
    <script src="https://cdn.boldreports.com/14.1.12/scripts/v2.0/common/bold.reports.widgets.min.js"></script>
    <script src="https://cdn.boldreports.com/14.1.12/scripts/v2.0/bold.report-viewer.min.js"></script>

    <script>
        (function () {
            "use strict";

            // A fragment keeps the Windows file URL identical to opening the
            // HTML directly. Fall back to the query string for compatibility
            // with older deployments.
            var contextValues = window.location.hash.length > 1
                ? window.location.hash.substring(1)
                : window.location.search.substring(1);
            var query = new URLSearchParams(contextValues);
            var defaultReportPath = "/Sales Report/test report";
            var reportPath = query.get("report_path") || defaultReportPath;
            var outlet = query.get("outlet") || "";
            var startDate = query.get("start_date") || "";
            var endDate = query.get("end_date") || "";
            var reportServerUrl = query.get("report_server_url") || "";
            var reportServiceUrl = query.get("report_service_url") || "";
            var reportToken = query.get("report_token") || "";

            var status = document.getElementById("status");
            var statusMessage = document.getElementById("status-message");
            var hasError = false;

            function buildReportParameters() {
                var valuesByParameterName = {
                    outlet: outlet,
                    start_date: startDate,
                    end_date: endDate
                };

                return Object.keys(valuesByParameterName).reduce(function (parameters, parameterName) {
                    var value = valuesByParameterName[parameterName];
                    if (value) {
                        parameters.push({
                            name: parameterName,
                            values: [value]
                        });
                    }
                    return parameters;
                }, []);
            }

            // Custom production JavaScript can read this context directly.
            window.reportViewerContext = Object.freeze({
                reportPath: reportPath,
                outlet: outlet,
                start_date: startDate,
                end_date: endDate
            });

            function hideStatus() {
                if (!hasError) {
                    status.hidden = true;
                }
            }

            function showError(message) {
                hasError = true;
                status.classList.add("error");
                statusMessage.textContent = message;
                status.hidden = false;
            }

            window.addEventListener("error", function (event) {
                if (event.target && event.target.tagName === "SCRIPT") {
                    showError("A required Bold Reports script could not be loaded. Check the network connection and reload the page.");
                }
            }, true);

            window.addEventListener("unhandledrejection", function (event) {
                console.error("[report-viewer] Unhandled promise rejection:", event.reason);
            });

            var activeDateInput = null;

            function isDateInput(input) {
                return input && input.matches && input.matches(
                    "input.e-datepicker, input.e-datetimepicker, " +
                    ".e-datepicker input, .e-datetimepicker input, " +
                    "input[id*='date' i]"
                );
            }

            function rememberDateInput(event) {
                var target = event.target;
                if (isDateInput(target)) {
                    activeDateInput = target;
                    return;
                }

                var wrapper = target && target.closest
                    ? target.closest(".e-date-wrapper, .e-datetime-wrapper, .e-input-group")
                    : null;
                var input = wrapper ? wrapper.querySelector("input") : null;
                if (isDateInput(input)) {
                    activeDateInput = input;
                }
            }

            function resolveDateInput(calendar) {
                var popup = calendar.closest("[id$='_popup']");
                if (popup) {
                    var inputId = popup.id.substring(0, popup.id.length - 6);
                    var popupInput = document.getElementById(inputId);
                    if (isDateInput(popupInput)) {
                        return popupInput;
                    }
                }

                if (isDateInput(activeDateInput)) {
                    return activeDateInput;
                }

                return document.querySelector(
                    "input.e-datepicker[aria-expanded='true'], " +
                    "input.e-datetimepicker[aria-expanded='true'], " +
                    ".e-date-wrapper input[aria-expanded='true'], " +
                    ".e-datetime-wrapper input[aria-expanded='true']"
                );
            }

            function selectedCalendarDate(cell, calendar) {
                var rawValue = cell.getAttribute("data-value");
                if (rawValue && /^\d+$/.test(rawValue)) {
                    var timestampDate = new Date(Number(rawValue));
                    if (!isNaN(timestampDate.getTime())) {
                        return timestampDate;
                    }
                }

                var label = cell.getAttribute("aria-label") || cell.getAttribute("title");
                if (label) {
                    var labelledDate = new Date(label);
                    if (!isNaN(labelledDate.getTime())) {
                        return labelledDate;
                    }
                }

                var day = Number(cell.textContent.trim());
                var title = calendar.querySelector(".e-title");
                var match = title && title.textContent.trim().match(/^([A-Za-z]+)\s+(\d{4})$/);
                if (!Number.isInteger(day) || day < 1 || day > 31 || !match) {
                    return null;
                }

                var month = [
                    "january", "february", "march", "april", "may", "june",
                    "july", "august", "september", "october", "november", "december"
                ].indexOf(match[1].toLowerCase());
                if (month < 0) {
                    return null;
                }

                if (cell.classList.contains("e-other-month")) {
                    month += day > 15 ? -1 : 1;
                }
                return new Date(Number(match[2]), month, day);
            }

            function formatParameterDate(date) {
                function pad(value) {
                    return String(value).padStart(2, "0");
                }
                return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate());
            }

            function repairDateSelection(input, date, originalEvent) {
                var expectedValue = formatParameterDate(date);
                if (input.value === expectedValue) {
                    return;
                }

                var ej2Instance = input.ej2_instances && input.ej2_instances[0];
                if (ej2Instance) {
                    ej2Instance.value = date;
                    if (typeof ej2Instance.dataBind === "function") {
                        ej2Instance.dataBind();
                    }
                    if (typeof ej2Instance.trigger === "function") {
                        ej2Instance.trigger("change", {
                            value: date,
                            event: originalEvent,
                            element: input,
                            isInteracted: true
                        });
                    }
                    if (typeof ej2Instance.hide === "function") {
                        ej2Instance.hide(originalEvent);
                    }
                }

                var jqInput = window.jQuery ? window.jQuery(input) : null;
                var ej1Instance = jqInput && (
                    jqInput.data("ejDateTimePicker") || jqInput.data("ejDatePicker")
                );
                if (ej1Instance) {
                    if (typeof ej1Instance.setValue === "function") {
                        ej1Instance.setValue(date);
                    }
                    if (typeof ej1Instance._trigger === "function") {
                        ej1Instance._trigger("change", { value: date });
                    }
                    if (typeof ej1Instance.hide === "function") {
                        ej1Instance.hide();
                    }
                }

                // Bold also observes the input's native change event when it
                // copies the parameter values before running the report.
                input.value = expectedValue;
                input.dispatchEvent(new Event("input", { bubbles: true }));
                input.dispatchEvent(new Event("change", { bubbles: true }));
                console.info("[report-datepicker] repaired selection", {
                    id: input.id,
                    value: input.value
                });
            }

            document.addEventListener("focusin", rememberDateInput, true);
            document.addEventListener("pointerdown", rememberDateInput, true);

            // WebView2 can deliver the calendar click without Bold's embedded
            // date widget committing it to the parameter input. Let Bold run
            // first, then repair only a selection it left unchanged.
            document.addEventListener("click", function (event) {
                var target = event.target && event.target.closest
                    ? event.target.closest(".e-calendar td, .e-calendar .e-cell")
                    : null;
                if (!target) {
                    return;
                }
                window.setTimeout(function () {
                    var calendar = target.closest(".e-calendar");
                    var input = calendar ? resolveDateInput(calendar) : null;
                    var date = calendar ? selectedCalendarDate(target, calendar) : null;
                    if (input && date) {
                        repairDateSelection(input, date, event);
                    }
                }, 0);
            }, true);

            $(function () {
                if (!reportServerUrl || !reportServiceUrl || !reportToken) {
                    showError("The report configuration is missing. Close this viewer and open the report again.");
                    return;
                }

                if (typeof $.fn.boldReportViewer !== "function") {
                    showError("Bold Report Viewer could not be initialized because its scripts did not load.");
                    return;
                }

                $(document).ajaxError(function (_event, request, settings) {
                    if (settings.url && settings.url.indexOf(reportServiceUrl) === 0) {
                        showError("The report service returned HTTP " + request.status + ". Check the token, CORS policy, and report server availability.");
                    }
                });

                try {
                    var viewerOptions = {
                        reportServerUrl: reportServerUrl,
                        reportServiceUrl: reportServiceUrl,
                        serviceAuthorizationToken: reportToken,
                        reportPath: reportPath,
                        isResponsive: true,
                        // The app sends date parameters as yyyy-MM-dd. An
                        // explicit matching format lets Bold's DatePicker
                        // parse the initial value and write selected dates
                        // back into its input reliably in WebView2.
                        parameterSettings: {
                            dateTimeFormat: "yyyy-MM-dd"
                        },
                        // Printing needs its own WebView window on Flutter
                        // desktop so the printable page can open WebView2's
                        // native print preview without replacing the viewer.
                        printOption: ej.ReportViewer.PrintOptions.NewTab,
                        reportLoaded: hideStatus
                    };
                    var reportParameters = buildReportParameters();
                    if (reportParameters.length > 0) {
                        viewerOptions.parameters = reportParameters;
                    }
                    $("#viewer").boldReportViewer(viewerOptions);

                    // Do not hide this status on a timer. In production that
                    // turned a stalled script or report request into a blank
                    // white screen with no useful information.
                    window.setTimeout(function () {
                        if (!status.hidden && !hasError) {
                            statusMessage.textContent = "The report is still loading. Check the network connection, token, and report server availability.";
                        }
                    }, 15000);
                } catch (error) {
                    showError("Could not start Bold Report Viewer: " + error.message);
                }
            });
        }());
    </script>
</body>
</html>
